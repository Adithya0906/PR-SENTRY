name: PR Sentry - Sentry on the Diff

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: C# Code Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PR Sentry
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
